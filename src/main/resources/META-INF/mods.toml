modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="${geckolib_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="${player_anim_version_range}"
    ordering="AFTER"
    side="BOTH"

# Opcional: Customizable Player Models (si está, se respeta su modelo de jugador)
[[dependencies.${mod_id}]]
    modId="cpm"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Opcional: Simple Voice Chat (si está, las pociones de voz cambian la voz; sin él solo faltan las voces)
[[dependencies.${mod_id}]]
    modId="voicechat"
    mandatory=false
    versionRange="[1.20.1-2.5.0,)"
    ordering="AFTER"
    side="BOTH"

# Opcional: JEI (si está, muestra las recetas del fogón y de las máquinas de la feria, y páginas de información)
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="BOTH"
