name: Compilar JAR

on:
  push:
    # main = lo publicado; arreglos = 1.x.(y+1); novedades = 1.(x+1).0; version-2 = 2.0.0
    branches: [main, arreglos, novedades, version-2, agente-v2-liminal]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Compilar
        run: |
          chmod +x gradlew
          curl -s https://maven.maxhenkel.de/repository/public/de/maxhenkel/voicechat/voicechat-api/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -6 || true
          # la descarga de Gradle a veces falla (504): se reintenta antes de compilar
          for i in 1 2 3 4 5 6; do ./gradlew --version >/dev/null 2>&1 && break; echo "Gradle no se ha podido descargar (intento $i), reintento en 30 s"; sleep 30; done
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Guardar registro de errores
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan ci-log
          git rm -rfq .
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "Registro de compilación ${GITHUB_SHA::7}"
          git push -f origin ci-log
      - uses: actions/upload-artifact@v4
        with:
          name: miscelanea-jar
          path: build/libs/*.jar
      - name: Publicar JAR en una release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Miscelánea build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: build/libs/*.jar
