name: Probar en el juego

# Después de cada build: arranca un servidor dedicado con el mod (¿carga sin petar?) y el juego de verdad sin pantalla
# (Xvfb + gráficos por software) con MC-Runtime-Test, que crea un mundo; dentro, PruebaCI recorre el móvil sacando
# capturas. Todo lo que sale (capturas, registros, informes de crash) se sube como artefacto.

on:
  workflow_run:
    workflows: [Compilar JAR]
    types: [completed]
  workflow_dispatch:
    inputs:
      build:
        description: Número de build a probar (vacío = la última)
        required: false

permissions:
  contents: write
  actions: read

env:
  MC: 1.20.1
  FORGE: 47.3.0

jobs:
  preparar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.n.outputs.build }}
    steps:
      - id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="${{ github.event.inputs.build }}"
          if [ -z "$B" ]; then B="${{ github.event.workflow_run.run_number }}"; fi
          if [ -z "$B" ]; then B=$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName -q '.[0].tagName' | sed 's/build-//'); fi
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "Build a probar: $B"
      - name: Bajar el jar y las dependencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mods opcionales
          gh release download "build-${{ steps.n.outputs.build }}" -R "$GITHUB_REPOSITORY" -D mods -p '*.jar'
          bajar() {  # bajar <slug> <carpeta>: la última versión para Forge 1.20.1 en Modrinth
            url=$(curl -sf "https://api.modrinth.com/v2/project/$1/version?loaders=%5B%22forge%22%5D&game_versions=%5B%22${MC}%22%5D" \
                  | jq -r '(([.[] | select(.version_type=="release")] + .)[0].files // []) | ((map(select(.primary))[0] // .[0]).url // "null")' || true)
            if [ -n "$url" ] && [ "$url" != "null" ]; then curl -sfL -o "$2/$1.jar" "$url" && echo "$1: $url"; else echo "::warning::No encuentro $1 en Modrinth"; fi
          }
          bajar geckolib mods
          bajar playeranimator mods
          bajar simple-voice-chat opcionales
          bajar customizable-player-models opcionales || bajar cpm opcionales || true
          # para la prueba con shaders: Embeddium + Oculus y un pack ligero
          mkdir -p shaders shaderpacks
          bajar embeddium shaders
          bajar oculus shaders
          for p in miniature-shader vanilla-plus-shader complementary-reimagined; do
            url=$(curl -sf "https://api.modrinth.com/v2/project/$p/version" | jq -r '.[0].files[0].url // "null"' || true)
            if [ -n "$url" ] && [ "$url" != "null" ]; then curl -sfL -o "shaderpacks/$p.zip" "$url" && echo "pack: $p $url" && break; fi
          done
          ls -la mods opcionales shaders shaderpacks
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            mods
            opcionales
            shaders
            shaderpacks

  servidor:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: mods
      - name: Instalar Forge (servidor)
        run: |
          curl -sfL -o instalador.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${MC}-${FORGE}/forge-${MC}-${FORGE}-installer.jar"
          java -jar instalador.jar --installServer srv > instalar.log 2>&1 || (tail -40 instalar.log; exit 1)
          cd srv
          echo eula=true > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-npcs=false\nview-distance=4\nsimulation-distance=4\n' > server.properties
          mkdir -p mods && cp ../mods/*.jar ../opcionales/*.jar mods/ 2>/dev/null || true
          ls mods
      - name: Arrancar y parar el servidor
        run: |
          cd srv
          mkfifo entrada
          (tail -f entrada | timeout 600 ./run.sh nogui > servidor.log 2>&1; echo "salida $?" > salida.txt) &
          exec 3>entrada
          for i in $(seq 1 540); do
            if grep -q 'Done (' servidor.log; then echo "Arrancado en ${i}s"; break; fi
            if [ -f salida.txt ]; then echo "El servidor se ha parado solo"; break; fi
            sleep 1
          done
          sleep 15                     # unos ticks con el mundo cargado
          echo stop >&3
          for i in $(seq 1 90); do grep -q 'All dimensions are saved' servidor.log && break; sleep 1; done
          grep -q 'All dimensions are saved' servidor.log && echo "Parado bien" || echo "::warning::El servidor no terminó de pararse"
          if grep -E '(ERROR|FATAL).*' servidor.log | grep -i -q 'miscelanea'; then echo "::error::Errores de Miscelánea en el servidor"; grep -E '(ERROR|FATAL)' servidor.log | grep -i miscelanea; exit 1; fi
          echo "----- líneas de Miscelánea y errores -----"
          grep -n -i -E 'miscelanea|exception|error' servidor.log | grep -v -i 'Error loading class' | head -80 || true
          if ! grep -q 'Done (' servidor.log; then echo "::error::El servidor no llegó a arrancar"; tail -80 servidor.log; exit 1; fi
          if ls crash-reports/*.txt >/dev/null 2>&1; then echo "::error::Hay informe de crash"; cat crash-reports/*.txt | head -120; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: servidor
          path: |
            srv/servidor.log
            srv/logs/
            srv/crash-reports/

  cliente:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shaders: [false, true]
    # con shaders es una prueba de más: si falla no tumba el resto
    continue-on-error: ${{ matrix.shaders }}
    env:
      # capturas de main en prueba / prueba-shaders; de las otras ramas, en prueba-<rama> / prueba-<rama>-shaders
      RAMA: ${{ format('prueba{0}{1}', (github.event.workflow_run.head_branch || github.ref_name) == 'main' && '' || format('-{0}', github.event.workflow_run.head_branch || github.ref_name), matrix.shaders && '-shaders' || '') }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: mods
      - name: Poner los mods
        run: |
          mkdir -p run/mods
          cp mods/*.jar opcionales/*.jar run/mods/ 2>/dev/null || true
          ls run/mods
          printf 'lang:es_es\n' > run/options.txt     # en castellano, como lo juegan
          if [ "${{ matrix.shaders }}" = "true" ]; then
            cp shaders/*.jar run/mods/
            mkdir -p run/shaderpacks run/config && cp shaderpacks/*.zip run/shaderpacks/
            PACK=$(ls shaderpacks | head -1)
            printf 'enableShaders=true\nshaderPack=%s\n' "$PACK" > run/config/oculus.properties
            cat run/config/oculus.properties
          fi
      - name: Abrir el juego y probar el móvil
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ env.MC }}
          modloader: forge
          regex: .*forge.*
          mc-runtime-test: forge
          java: 17
          headlessmc-command: --jvm "-Djava.awt.headless=true -Dmiscelanea.prueba=true -Xmx3G"
      - name: Resumen
        if: always()
        run: |
          cat run/prueba_miscelanea.txt 2>/dev/null || echo "No hay resumen (la prueba no llegó al final)"
          ls run/screenshots 2>/dev/null || true
          grep -n -E 'PruebaCI|miscelanea.*(ERROR|Exception)' run/logs/latest.log 2>/dev/null | head -60 || true
      - name: Resumir el perfil de rendimiento (JFR)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/sal
          ls -la run/perfil.jfr run/perfil_fases.txt 2>/dev/null || true
          if [ -f run/perfil.jfr ]; then
            jfr print --json --events jdk.ExecutionSample --stack-depth 40 run/perfil.jfr > /tmp/muestras.json || true
            cat > /tmp/perfil.py <<'PYEOF'
          import json, sys, collections, datetime
          muestras = json.load(open(sys.argv[1]))['recording']['events']
          fases = []
          try:
              for l in open(sys.argv[2]):
                  n, t = l.strip().split('=')
                  fases.append((n, int(t)))
          except Exception:
              pass
          def ms(s):
              # "2026-11-08T17:30:01.123456789Z" o similar
              s = s.replace('Z', '+00:00')
              if '.' in s:
                  a, b = s.split('.', 1)
                  frac, tz = (b[:b.index('+')], b[b.index('+'):]) if '+' in b else (b, '')
                  s = a + '.' + frac[:6] + tz
              return int(datetime.datetime.fromisoformat(s).timestamp() * 1000)
          def fase(t):
              nombre = None
              for i, (n, ti) in enumerate(fases):
                  if t >= ti: nombre = fases[i + 1][0] if i + 1 < len(fases) else None
              return nombre
          por = collections.defaultdict(lambda: [collections.Counter(), collections.Counter(), 0])
          for e in muestras:
              v = e['values']
              hilo = (v.get('sampledThread') or {}).get('javaName', '')
              if hilo != 'Render thread': continue
              f = fase(ms(v['startTime']))
              if f is None: continue
              st = (v.get('stackTrace') or {}).get('frames', [])
              if not st: continue
              d = por[f]
              d[2] += 1
              def nom(fr):
                  m = fr['method']; return m['type']['name'].split('.')[-1] + '.' + m['name']
              d[0][nom(st[0])] += 1
              vistos = set()
              for fr in st:
                  n = nom(fr)
                  if 'miscelanea' in fr['method']['type']['name'] and n not in vistos:
                      vistos.add(n); d[1][n] += 1
          for f, (propio, incl, total) in por.items():
              print(f'===== fase {f}: {total} muestras del hilo de dibujo')
              print('  -- más tiempo propio:')
              for n, c in propio.most_common(25): print(f'  {100*c/total:5.1f}%  {n}')
              print('  -- métodos de Miscelánea (incluido lo que llaman):')
              for n, c in incl.most_common(30): print(f'  {100*c/total:5.1f}%  {n}')
          PYEOF
            python3 /tmp/perfil.py /tmp/muestras.json run/perfil_fases.txt > /tmp/sal/perfil.txt || true
            head -80 /tmp/sal/perfil.txt || true
          fi
      - name: Guardar capturas y registros en una rama (prueba / prueba-shaders)
        if: always()
        run: |
          mkdir -p /tmp/sal && cp -r run/screenshots /tmp/sal/ 2>/dev/null || true
          cp run/prueba_miscelanea.txt /tmp/sal/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/sal/ 2>/dev/null || true
          cp -r run/crash-reports /tmp/sal/ 2>/dev/null || true
          echo "build ${{ needs.preparar.outputs.build }}" > /tmp/sal/build.txt
          cd /tmp/sal && git init -q && git checkout -q -b "$RAMA"
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Prueba de la build ${{ needs.preparar.outputs.build }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$RAMA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cliente-${{ env.RAMA }}
          path: |
            run/screenshots/
            run/prueba_miscelanea.txt
            run/logs/
            run/crash-reports/
